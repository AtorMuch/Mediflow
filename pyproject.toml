[project]
name = "mediflow"
version = "0.1.0"
description = "MediFlow: agente autónomo de triaje documental (LangGraph + LangChain)"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=1.0", "langchain>=1.0", "langchain-core>=1.0",
  "langchain-openai>=1.0", "pydantic>=2.6",
]

[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]
slack = ["slack-bolt>=1.20", "slack-sdk>=3.27"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["mediflow"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
